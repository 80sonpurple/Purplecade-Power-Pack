<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Purplecade Power Pack</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:purple;
    color:red;
    text-align:center;
}

header{
    padding:20px;
    background:#5b0080;
}

h1,h2{
    color:red;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    margin:20px;
}

button{
    background:orange;
    color:black;
    border:none;
    padding:12px 22px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.9;
}

iframe{
    width:95%;
    height:700px;
    border:3px solid orange;
    border-radius:10px;
    margin:20px auto;
    display:block;
    background:white;
}

#backButton{
    display:none;
    margin:20px auto;
}
</style>
</head>

<body>

<header>
    <h1>The Purplecade Power Pack</h1>
</header>

<div id="menu">

    <h2>Game Selection</h2>

    <div class="container">
        <button onclick="loadPage('https://play.fancade.com/6A3B649B52404D6E')">
            Purple the Heatwave
        </button>
        <button onclick="loadPage('https://play.fancade.com/6A7A3633558AF87A')">
            Fuel Eye
        </button>
        <button onclick="loadPage('https://play.fancade.com/6A72C2F9F7A40405')">
            Purple Forever After
        </button>
    </div>

    <h2>Extras</h2>

    <div class="container">
        <button onclick="loadPage('https://docs.google.com/document/d/1AE0SrwF-TMmR6Bu9J7IivDtTD5BtO7RgXlrghey4gOI/edit?usp=drivesdk')">
            Purple the Heatwave Official Manual
        </button>
        <button onclick="loadPage('https://docs.google.com/document/d/1FRgq0a7uDjypbn1pCZHC2MM8vSGdAf1pteGisDRvDi0/edit?usp=drivesdk')">
            Fuel Eye Official Manual
        </button>
        <button onclick="loadPage('https://docs.google.com/document/d/1KNFYGeMGnkCinQIWq1ex9BoC4zvhasMmTR0P_ydxo_U/edit?usp=drivesdk')">
            Purple Forever After Official Manual
        </button>
    </div>

</div>

<button id="backButton" onclick="goHome()">⬅ Back to Home</button>

<iframe id="viewer" style="display:none;"></iframe>

<script>
const viewer = document.getElementById("viewer");
const menu = document.getElementById("menu");
const backButton = document.getElementById("backButton");

function loadPage(url){
    viewer.src = url;
    viewer.style.display = "block";
    backButton.style.display = "inline-block";
    menu.style.display = "none";
}

function goHome(){
    viewer.src = "";
    viewer.style.display = "none";
    backButton.style.display = "none";
    menu.style.display = "block";
}
</script>

</body>
</html>
