<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Purplecade Power Pack</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: purple;
    color: red;
    text-align: center;
}

/* =========================
   HOME PAGE
========================= */

#menu {
    min-height: 100dvh;
}

header {
    padding: 20px;
    background: #5b0080;
}

h1,
h2 {
    color: red;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin: 20px;
}

button {
    background: orange;
    color: black;
    border: none;
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.9;
}

/* =========================
   FULL-SCREEN VIEWER
========================= */

#viewerPage {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    background: black;

    display: none;
    flex-direction: column;

    z-index: 999;
}

/* =========================
   EMBED
========================= */

#viewer {
    display: block;

    width: 100%;
    height: calc(100dvh - 55px);

    flex: 1;

    border: none;
    background: black;
}

/* =========================
   CONTROL BAR
========================= */

#controls {
    width: 100%;
    height: 55px;
    min-height: 55px;

    background: #222;

    display: flex;
    align-items: center;

    padding: 5px 10px;
}

#backButton {
    display: block;

    margin: 0;

    padding: 9px 18px;

    background: orange;
    color: black;

    border-radius: 8px;

    font-size: 16px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #viewer {
        height: calc(100dvh - 50px);
    }

    #controls {
        height: 50px;
        min-height: 50px;
    }

    #backButton {
        padding: 8px 14px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME MENU
========================= -->

<div id="menu">

    <header>
        <h1>The Purplecade Power Pack</h1>
    </header>


    <h2>Game Selection</h2>

    <div class="container">

        <button onclick="loadPage('https://play.fancade.com/6A3B649B52404D6E')">
            Purple the Heatwave
        </button>

        <button onclick="loadPage('https://play.fancade.com/6A7A3633558AF87A')">
            Fuel Eye
        </button>

        <button onclick="loadPage('https://play.fancade.com/6A72C2F9F7A40405')">
            Purple Forever After
        </button>
        
        <button onclick="loadPage('https://play.fancade.com/6A851975E0AB4C6D')">
            Men In Dead:Ghost Seas
        </button>
        
        <button onclick="loadPage('https://play.fancade.com/6A8FA42179678FB2')">
            Just Eat It
        </button>
        
        <button onclick="loadPage('https://play.fancade.com/6A965D94A12EB83B')">
            Sphererollies:Roll Spheres Roll
        </button>

    </div>


    <h2>Extras</h2>

    <div class="container">

        <button onclick="loadPage('https://docs.google.com/document/d/1AE0SrwF-TMmR6Bu9J7IivDtTD5BtO7RgXlrghey4gOI/edit?usp=drivesdk')">
            Purple the Heatwave Official Manual
        </button>

        <button onclick="loadPage('https://docs.google.com/document/d/1FRgq0a7uDjypbn1pCZHC2MM8vSGdAf1pteGisDRvDi0/edit?usp=drivesdk')">
            Fuel Eye Official Manual
        </button>

        <button onclick="loadPage('https://docs.google.com/document/d/1KNFYGeMGnkCinQIWq1ex9BoC4zvhasMmTR0P_ydxo_U/edit?usp=drivesdk')">
            Purple Forever After Official Manual
        </button>
        
        <button onclick="loadPage('https://docs.google.com/document/d/1Ke1RsEIjLXfFBERziJtqvOIOflvrY2jMNupaZmEgBZ0/edit?usp=drivesdk')">
            Men In Dead Ghost Seas Official Manual
        </button>
        
        <button onclick="loadPage('https://docs.google.com/document/d/1Ko8vkwByTNpDVEWM9N6tiBmNrZj9ggCkmTPeCaOOlgk/edit?usp=drivesdk')">
            Just Eat It Official Manual
        </button>
        
        <button onclick="loadPage('https://docs.google.com/document/d/1LAE9NUS98skR5VLCNqW2MJu36ke3W_FTPEXa6J5KsBA/edit?usp=drivesdk')">
            Sphererollies Roll Spheres Roll Official Manual
        </button>

    </div>

</div>


<!-- =========================
     FULL-SCREEN VIEWER
========================= -->

<div id="viewerPage">

    <iframe
        id="viewer"
        allowfullscreen>
    </iframe>

    <div id="controls">

        <button
            id="backButton"
            onclick="goHome()">
            ⬅ Back to Home
        </button>

    </div>

</div>


<script>

const viewer = document.getElementById("viewer");
const menu = document.getElementById("menu");
const viewerPage = document.getElementById("viewerPage");


function loadPage(url) {

    menu.style.display = "none";

    viewerPage.style.display = "flex";

    viewer.src = url;
}


function goHome() {

    viewer.src = "";

    viewerPage.style.display = "none";

    menu.style.display = "block";
}

</script>

</body>
</html>
